<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>عيادة المروج</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Layout: a right-hand rail with four sections beside one working column; bottom tab bar on phones.
   Palette: glass-teal on cool paper, amber for waiting, red for debts. Type: Readex Pro for headings and figures, IBM Plex Sans Arabic for text. */
:root{
  --bg:#EDF3F2; --surface:#FFFFFF; --surface-2:#E3ECEB; --line:#D0DCDA;
  --fg:#0F2729; --fg-2:#476063;
  --accent:#0A6B6C; --on-accent:#FFFFFF; --accent-soft:#D3EBE8; --accent-ink:#064B4C;
  --good:#23764A; --good-soft:#DCEFE3;
  --warn:#94590A; --warn-soft:#FAEBCE;
  --bad:#B0352A; --bad-soft:#F8DEDA;
  --exp:#9DB2B0;
  --f-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1819; --surface:#132426; --surface-2:#1B3033; --line:#28403F;
    --fg:#E4EFEE; --fg-2:#9DB5B4;
    --accent:#4FC3BE; --on-accent:#062B2B; --accent-soft:#17393A; --accent-ink:#A3E6E1;
    --good:#6CCB91; --good-soft:#17352A;
    --warn:#E8B357; --warn-soft:#3A2E14;
    --bad:#F08A7E; --bad-soft:#3D1E1B;
    --exp:#5B7A79;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1819; --surface:#132426; --surface-2:#1B3033; --line:#28403F;
  --fg:#E4EFEE; --fg-2:#9DB5B4;
  --accent:#4FC3BE; --on-accent:#062B2B; --accent-soft:#17393A; --accent-ink:#A3E6E1;
  --good:#6CCB91; --good-soft:#17352A;
  --warn:#E8B357; --warn-soft:#3A2E14;
  --bad:#F08A7E; --bad-soft:#3D1E1B;
  --exp:#5B7A79;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--f-body);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{unicode-bidi:isolate;direction:ltr;font-variant-numeric:tabular-nums}
.cur{font-size:.8em;opacity:.75;margin-inline-start:2px}
.muted{color:var(--fg-2)}
h1{font:600 27px/1.25 var(--f-display);text-wrap:balance}
h2{font:600 17px/1.3 var(--f-display)}

/* shell */
.app{max-width:1200px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:236px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:20px;display:grid;gap:26px}
.main{min-width:0}
.mhead{display:none;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 23px/1 var(--f-display);flex:none}
.brand b{display:block;font:600 17px/1.25 var(--f-display)}
.brand span{font-size:12.5px;color:var(--fg-2)}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-weight:500;text-align:start}
.nav button svg{flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;line-height:1.5}
.doc .av{width:38px;height:38px;font-size:13px}
.doc b{display:block;font-size:14px}
.hours{font-size:12.5px;color:var(--fg-2);padding-inline:4px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--fg-2);font-size:11.5px;font-weight:500;border-radius:10px}
.tabbar button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}

/* page parts */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--fg-2);font-size:14px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
.cols.fin{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.stack{display:grid;gap:20px}
.empty{padding:28px 18px;color:var(--fg-2);text-align:center}
.more{padding:14px;display:flex;justify-content:center;border-top:1px solid var(--line)}
.list>li+li{border-top:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.link{background:none;border:0;padding:0;font-weight:600;text-align:start;color:var(--fg)}
.link:hover{color:var(--accent);text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;margin-bottom:12px;color:var(--fg-2);font-weight:500}
.back:hover{color:var(--accent)}

.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st-booked{background:var(--accent-soft);color:var(--accent-ink)}
.st-waiting{background:var(--warn-soft);color:var(--warn)}
.st-done{background:var(--good-soft);color:var(--good)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.st-cancelled,.neutral{background:var(--surface-2);color:var(--fg-2)}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:600 14px/1 var(--f-display);flex:none}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr)}
.strip>div{padding:16px 20px;display:grid;gap:2px;border-inline-start:1px solid var(--line)}
.strip>div:first-child{border-inline-start:0}
.strip .k{font-size:13px;color:var(--fg-2)}
.strip .v{font:600 26px/1.3 var(--f-display)}
.strip .v.good{color:var(--good)}
.strip .v.bad{color:var(--bad)}

/* appointments */
.appt{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;grid-template-areas:"t b s a";gap:6px 14px;align-items:center;padding:12px 18px}
.appt .at{grid-area:t;display:grid;justify-items:start;line-height:1.2}
.appt .at b{font:600 18px/1.2 var(--f-display)}
.appt .at small{font-size:12px;color:var(--fg-2)}
.appt .ab{grid-area:b;display:grid;min-width:0}
.appt .ab .reason{font-size:13px;color:var(--fg-2)}
.appt .as{grid-area:s}
.appt .aa{grid-area:a;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.appt.waiting{background:var(--warn-soft)}
.appt.cancelled .link{text-decoration:line-through;color:var(--fg-2)}
.appt.free{padding-block:8px;grid-template-areas:"t f";grid-template-columns:64px minmax(0,1fr)}
.slot{grid-area:f;min-height:40px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--fg-2);text-align:start;padding:0 14px}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.day{flex:none;min-width:72px;display:grid;justify-items:center;gap:0;padding:8px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.35}
.day span{font-size:12.5px;color:var(--fg-2)}
.day b{font:600 20px/1.3 var(--f-display)}
.day small{font-size:11.5px;color:var(--fg-2)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--on-accent);opacity:.85}

/* patients */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 260px;min-width:0}
.search svg{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);color:var(--fg-2)}
.search input{width:100%;height:42px;padding-inline:40px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;font-size:13.5px;color:var(--fg-2)}
.chipb[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;padding:12px 16px;background:none;border:0;text-align:start}
.prow:hover{background:var(--surface-2)}
.pb{display:grid;min-width:0}
.pn{font-weight:600}
.pm{font-size:13px;color:var(--fg-2)}
.pr{display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--fg-2)}

/* profile */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px}
.phead .av{width:64px;height:64px;font-size:20px}
.phead .pi{display:grid;gap:2px;min-width:0}
.phead .pacts{margin-inline-start:auto}
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;align-items:start}
.kv dt{color:var(--fg-2);font-size:13.5px}
.kv.pad{padding:4px 18px 18px}
.chip{display:inline-flex;padding:1px 10px;border-radius:8px;font-size:13px;font-weight:500;margin:0 0 4px 4px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.acc-act{padding:0 18px 18px}
.bal{color:var(--bad);font-weight:600}
.tl{display:grid;gap:14px}
.visit{padding:16px 18px;display:grid;gap:12px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.vc{display:flex;gap:6px;flex-wrap:wrap}
.vacc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* finance */
.chart{padding:4px 18px 16px}
.plot{position:relative;height:220px;margin-top:22px}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl span{position:absolute;right:0;bottom:3px;font-size:11px;color:var(--fg-2)}
.bars{position:absolute;top:0;bottom:0;left:0;right:48px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:100%;z-index:1}
.grp{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%}
.bar{position:relative;width:min(26px,38%);min-height:2px;border-radius:5px 5px 0 0}
.bar.rev{background:var(--accent)}
.bar.exp{background:var(--exp)}
.bar i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-style:normal;font-size:10.5px;color:var(--fg-2);white-space:nowrap}
.months{display:grid;grid-template-columns:repeat(6,1fr);margin-right:48px;margin-top:8px;text-align:center;font-size:12.5px;color:var(--fg-2)}
.months .cur-m{color:var(--fg);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);padding:0 18px 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.rev{background:var(--accent)}
.sw.exp{background:var(--exp)}
.inv{display:grid;grid-template-columns:104px minmax(0,1fr) 120px 150px auto;grid-template-areas:"d p a s b";gap:6px 12px;align-items:center;padding:12px 18px}
.inv .iv-d{grid-area:d;font-size:13px;color:var(--fg-2)}
.inv .iv-p{grid-area:p;display:grid;min-width:0}
.inv .iv-a{grid-area:a;font-weight:600}
.inv .iv-s{grid-area:s}
.inv .iv-b{grid-area:b}
.inv .iv-b:empty{display:none}
.xrow{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;align-items:center}
.xrow small{display:block;color:var(--fg-2);font-size:12.5px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 18px}
.drow .r{display:flex;align-items:center;gap:10px}
.drow b{font-weight:600;color:var(--bad)}

/* modal + forms */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,22,24,.58)}
.sheet{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.sh-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.icon-btn{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-size:24px;line-height:1}
.icon-btn:hover{background:var(--surface-2)}
.sh-b{padding:18px 20px 22px;display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:6px;align-content:start;min-width:0}
.fld label{font-size:13.5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fld textarea{padding:10px 12px;min-height:78px;resize:vertical;line-height:1.6}
.span2{grid-column:1/-1}
.factions{display:flex;gap:10px;margin-top:4px}
.ferr{color:var(--bad);font-size:13.5px;font-weight:500;margin-top:10px}
.note{font-size:13px;color:var(--fg-2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:calc(100% - 32px);padding:10px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:96px}
  .side{display:none}
  .mhead{display:flex}
  .tabbar{display:flex}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .cols,.cols.fin,.prof{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  h1{font-size:23px}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div:nth-child(3){border-inline-start:0}
  .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .appt{grid-template-columns:56px minmax(0,1fr) auto;grid-template-areas:"t b s" ". a a";padding-inline:14px}
  .appt .aa{justify-content:flex-start}
  .appt.free{grid-template-columns:56px minmax(0,1fr);grid-template-areas:"t f"}
  .prow{grid-template-columns:44px minmax(0,1fr)}
  .pr{grid-column:2;display:flex;flex-wrap:wrap;justify-items:start;gap:4px 12px;align-items:center}
  .inv{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p s" "d a" "b b";padding-inline:14px}
  .inv .iv-a{text-align:end}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:84px minmax(0,1fr)}
  .phead{padding:16px}
  .phead .pacts{margin-inline-start:0;width:100%}
  .phead .pacts .btn{flex:1}
  #modal{align-items:flex-end;padding:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .sheet{width:100%;max-height:92%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="app" dir="rtl" lang="ar">
  <div class="mhead"><div class="mark">م</div><div class="brand"><div><b>عيادة المروج</b><span>باطنة وصحة عامة</span></div></div></div>
  <aside class="side">
    <div class="brand"><div class="mark">م</div><div><b>عيادة المروج</b><span>باطنة وصحة عامة</span></div></div>
    <nav class="nav" id="nav" aria-label="أقسام النظام"></nav>
    <div class="doc"><div class="av">ر ف</div><div><b>د. ريم فتحي</b>استشارية الباطنة</div></div>
    <p class="hours">مواعيد الكشف يوميًا من <span class="num">3:00</span> م إلى <span class="num">9:00</span> م</p>
  </aside>
  <main class="main"><div id="view"></div></main>
  <nav class="tabbar" id="tabs" aria-label="أقسام النظام"></nav>
</div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" tabindex="-1"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
try{document.documentElement.dir='rtl';document.documentElement.lang='ar';}catch(e){}

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(iso,n)=>{const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
const TODAY=toISO(new Date());
const LOC='ar-EG-u-nu-latn';
const fd=(iso,o)=>{try{return fromISO(iso).toLocaleDateString(LOC,o);}catch(e){return iso;}};
const D_LONG={weekday:'long',day:'numeric',month:'long',year:'numeric'};
const D_MED={day:'numeric',month:'short',year:'numeric'};
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const num=n=>Number(n).toLocaleString('en-US');
const money=n=>'<span class="num">'+num(n)+'</span><span class="cur">ج.م</span>';
const fmtK=v=>v===0?'0':(Math.round(v/100)/10)+'K';
const ageText=n=>n===1?'سنة واحدة':n===2?'سنتان':n<=10?n+' سنوات':n+' سنة';

function buildIdx(){
  const m=new Map();
  db.patients.forEach(p=>m.set(p.id,{n:0,last:'',fee:0,paid:0}));
  db.visits.forEach(v=>{const x=m.get(v.pid);if(!x)return;x.n++;x.fee+=v.fee;x.paid+=v.paid;if(v.date>x.last)x.last=v.date;});
  return m;
}

  else if(a.status==='waiting')acts='<button class="btn sm primary" data-action="appt-visit" data-id="'+a.id+'">بدء الكشف</button><button class="btn sm ghost" data-action="appt-cancel" data-id="'+a.id+'">إلغاء</button>';
  else if(a.status==='cancelled')acts='<button class="btn sm" data-action="appt-restore" data-id="'+a.id+'">إعادة الحجز</button>';
  return '<li class="appt '+a.status+'"><div class="at"><b class="num">'+x.n+'</b><small>'+x.s+'</small></div>'
    +'<div class="ab"><button class="link" data-action="open-patient" data-id="'+p.id+'">'+esc(p.name)+'</button><span class="reason">'+esc(a.reason)+' · '+ageText(p.age)+'</span></div>'
    +'<div class="as"><span class="pill '+st[1]+'">'+st[0]+'</span></div><div class="aa">'+acts+'</div></li>';
}

function viewToday(){

  const done=ap.filter(a=>a.status==='done').length;
  const coll=sum(db.payments.filter(x=>x.date===TODAY),'amount');

  const totalDebt=sum(debtors,'bal');
  return '<div class="ph"><div><h1>جدول اليوم</h1><p class="sub">'+fd(TODAY,D_LONG)+'</p></div>'

function viewPatients(){

function patientRow(p,x){
  const bal=x.fee-x.paid;
  return '<li><button class="prow" data-action="open-patient" data-id="'+p.id+'"><span class="av">'+esc(initials(p.name))+'</span>'
    +'<span class="pb"><span class="pn">'+esc(p.name)+'</span><span class="pm">'+ageText(p.age)+' · '+p.sex+(p.chronic?' · '+esc(p.chronic):'')+'</span></span>'
    +'<span class="pr"><span>'+(x.last?'آخر زيارة '+fd(x.last,D_MED):'لا توجد زيارات')+'</span>'
    +(bal>0?'<span class="pill st-bad">متبقي '+money(bal)+'</span>':'<span class="num">'+esc(p.phone)+'</span>')+'</span></button></li>';
}
function fillPatients(){
  const idx=buildIdx(),q=norm(ui.q.trim()),qd=q.replace(/\D/g,'');
  const rows=db.patients.filter(p=>{
    const x=idx.get(p.id);
    if(ui.pf==='debt'&&!(x.fee>x.paid))return false;
    if(ui.pf==='chronic'&&!p.chronic)return false;
    if(!q)return true;
    return norm(p.name).indexOf(q)>=0||(qd&&p.phone.replace(/\D/g,'').indexOf(qd)>=0)||String(p.id).indexOf(q)>=0;
  });
  rows.sort((a,b)=>(idx.get(b.id).last||'').localeCompare(idx.get(a.id).last||'')||a.name.localeCompare(b.name,'ar'));
  const shown=rows.slice(0,ui.pLimit);
  $('#pcount').textContent=rows.length+' من '+db.patients.length+' مريض';
  $('#plist').innerHTML=shown.length?shown.map(p=>patientRow(p,idx.get(p.id))).join(''):'<li class="empty">لا يوجد مريض يطابق البحث.</li>';
  $('#pmore').innerHTML=rows.length>shown.length?'<div class="more"><button class="btn" data-action="more-patients">عرض المزيد ('+(rows.length-shown.length)+')</button></div>':'';
}

function payChip(v){
  const bal=v.fee-v.paid;
  if(bal<=0)return '<span class="pill st-done">مدفوع</span>';
  if(v.paid===0)return '<span class="pill st-bad">غير مدفوع</span>';
  return '<span class="pill st-waiting">متبقي '+money(bal)+'</span>';
}

function viewAppts(){
  if(!ui.day||ui.day<TODAY)ui.day=TODAY;
  const days=[];for(let i=0;i<14;i++)days.push(addDays(TODAY,i));
  const cnt=d=>db.appts.filter(a=>a.date===d&&a.status!=='cancelled').length;
  const strip=days.map(d=>'<button class="day" data-action="pick-day" data-date="'+d+'" aria-pressed="'+(d===ui.day)+'"><span>'+(d===TODAY?'اليوم':fd(d,{weekday:'short'}))+'</span><b class="num">'+(+d.slice(8))+'</b><small>'+(cnt(d)?cnt(d)+' حجز':'فارغ')+'</small></button>').join('');
  const busy=cnt(ui.day);
  const rows=SLOTS.map(t=>{
    const a=db.appts.find(x=>x.date===ui.day&&x.time===t&&x.status!=='cancelled');
    if(a)return apptRow(a);
    const x=tparts(t);
    return '<li class="appt free"><div class="at"><b class="num">'+x.n+'</b><small>'+x.s+'</small></div><button class="slot" data-action="new-appt" data-date="'+ui.day+'" data-time="'+t+'">موعد متاح، اضغط للحجز</button></li>';
  }).join('');
  const cancelled=db.appts.filter(a=>a.date===ui.day&&a.status==='cancelled').sort((a,b)=>a.time.localeCompare(b.time));
  return '<div class="ph"><div><h1>الحجوزات</h1><p class="sub">'+fd(ui.day,D_LONG)+' · '+busy+' من '+SLOTS.length+' مواعيد محجوزة</p></div>'
    +'<div class="pacts"><button class="btn primary" data-action="new-appt" data-date="'+ui.day+'">حجز جديد</button></div></div>'
    +'<div class="days" role="group" aria-label="اختيار اليوم">'+strip+'</div>'
    +'<section class="card"><ul class="list">'+rows+'</ul></section>'
    +(cancelled.length?'<section class="card" style="margin-top:20px"><div class="sec-h"><h2>حجوزات ملغاة</h2></div><ul class="list">'+cancelled.map(apptRow).join('')+'</ul></section>':'');
}

function viewFinance(){
  const ym=TODAY.slice(0,7);
  const mc=sum(db.payments.filter(x=>x.date.indexOf(ym)===0),'amount');
  const me=sum(db.expenses.filter(x=>x.date.indexOf(ym)===0),'amount');
  const open=db.visits.filter(v=>v.fee>v.paid);
  const out=sum(open.map(v=>({d:v.fee-v.paid})),'d');
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=toISO(d).slice(0,7);
    months.push({label:d.toLocaleDateString(LOC,{month:'long'}),rev:sum(db.payments.filter(x=>x.date.indexOf(key)===0),'amount'),exp:sum(db.expenses.filter(x=>x.date.indexOf(key)===0),'amount'),cur:i===0});
  }
  const mx=Math.max.apply(null,months.map(m=>Math.max(m.rev,m.exp)).concat([1000]));
  const top=Math.ceil(mx*1.12/2000)*2000;
  const ticks=[0,0.25,0.5,0.75,1].map(f=>top*f);
  const chart='<div class="chart" role="img" aria-label="الإيرادات والمصروفات خلال آخر 6 أشهر"><div class="plot">'
    +ticks.map(t=>'<div class="gl" style="bottom:'+(t/top*100)+'%"><span class="num">'+fmtK(t)+'</span></div>').join('')
    +'<div class="bars">'+months.map(m=>'<div class="grp" title="'+m.label+': إيرادات '+num(m.rev)+' ج.م، مصروفات '+num(m.exp)+' ج.م"><div class="bar rev" style="height:'+(m.rev/top*100)+'%"><i class="num">'+fmtK(m.rev)+'</i></div><div class="bar exp" style="height:'+(m.exp/top*100)+'%"></div></div>').join('')+'</div></div>'
    +'<div class="months">'+months.map(m=>'<span'+(m.cur?' class="cur-m"':'')+'>'+m.label+'</span>').join('')+'</div></div>'
    +'<div class="legend"><span><i class="sw rev"></i>إيرادات محصّلة</span><span><i class="sw exp"></i>مصروفات</span><span>الشهر الحالي يشمل الأيام حتى اليوم فقط (الأرقام بالألف جنيه)</span></div>';
  const all=db.visits.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const rows=ui.inv==='open'?all.filter(v=>v.fee>v.paid):all;
  const shown=rows.slice(0,ui.invLimit);
  const invHTML=shown.length?shown.map(v=>{
    const p=pat(v.pid),b=v.fee-v.paid;
    return '<li class="inv"><div class="iv-d">'+fd(v.date,D_MED)+'</div><div class="iv-p"><button class="link" data-action="open-patient" data-id="'+p.id+'">'+esc(p.name)+'</button><span class="sub">'+v.type+'</span></div><div class="iv-a">'+money(v.fee)+'</div><div class="iv-s">'+payChip(v)+'</div><div class="iv-b">'+(b>0?'<button class="btn sm" data-action="collect" data-pid="'+p.id+'" data-vid="'+v.id+'">تحصيل</button>':'')+'</div></li>';
  }).join(''):'<li class="empty">لا توجد فواتير مطابقة.</li>';
  const exps=db.expenses.filter(x=>x.date.indexOf(ym)===0).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const net=mc-me;
  return '<div class="ph"><div><h1>الماليات</h1><p class="sub">'+fd(TODAY,{month:'long',year:'numeric'})+'</p></div><div class="pacts"><button class="btn primary" data-action="new-expense">تسجيل مصروف</button></div></div>'
    +'<div class="card strip"><div><span class="k">الإيرادات المحصّلة هذا الشهر</span><b class="v">'+money(mc)+'</b></div>'
    +'<div><span class="k">المصروفات هذا الشهر</span><b class="v">'+money(me)+'</b></div>'
    +'<div><span class="k">صافي الشهر</span><b class="v '+(net>=0?'good':'bad')+'">'+money(net)+'</b></div>'
    +'<div><span class="k">مستحقات غير مسددة ('+open.length+' فاتورة)</span><b class="v bad">'+money(out)+'</b></div></div>'
    +'<section class="card" style="margin-top:20px"><div class="sec-h"><h2>الإيرادات والمصروفات</h2></div>'+chart+'</section>'
    +'<div class="cols fin"><section class="card"><div class="sec-h"><h2>الفواتير</h2><div class="chips">'+chipBtn('invfilter','all',ui.inv,'الكل')+chipBtn('invfilter','open',ui.inv,'غير مسددة')+'</div></div>'
    +'<ul class="list">'+invHTML+'</ul>'+(rows.length>shown.length?'<div class="more"><button class="btn" data-action="more-inv">عرض المزيد ('+(rows.length-shown.length)+')</button></div>':'')+'</section>'
    +'<section class="card"><div class="sec-h"><div><h2>مصروفات الشهر</h2><p class="sub">الإجمالي '+money(me)+'</p></div></div><ul class="list">'
    +(exps.length?exps.map(x=>'<li class="xrow"><div>'+esc(x.label)+'<small>'+fd(x.date,{day:'numeric',month:'long'})+'</small></div><b>'+money(x.amount)+'</b></li>').join(''):'<li class="empty">لا توجد مصروفات مسجلة هذا الشهر.</li>')
    +'</ul></section></div>';
}

/* ---------- modal + forms ---------- */
function openModal(title,body){
  sheet.innerHTML='<div class="sh-h"><h2 id="sh-t">'+title+'</h2><button class="icon-btn" data-action="close" aria-label="إغلاق">×</button></div><div class="sh-b">'+body+'</div>';
  modal.hidden=false;document.body.classList.add('lock');
  let fine=true;try{fine=window.matchMedia('(pointer:fine)').matches;}catch(e){}
  const f=sheet.querySelector('input:not([type=hidden]),select,textarea');
  if(fine&&f)f.focus();else sheet.focus();
}
function closeModal(){modal.hidden=true;document.body.classList.remove('lock');sheet.innerHTML='';}
function ferr(f,msg){const e=f.querySelector('.ferr');e.textContent=msg;e.hidden=false;}
const fld=(id,label,ctl,cls)=>'<div class="fld '+(cls||'')+'"><label for="'+id+'">'+label+'</label>'+ctl+'</div>';
const FOOT=(label)=>'<p class="ferr" role="alert" hidden></p><div class="factions"><button class="btn primary" type="submit">'+label+'</button><button class="btn" type="button" data-action="close">إلغاء</button></div>';

function openPatientForm(p){
  const v=p||{};
  const bl=['','A+','A-','B+','B-','AB+','AB-','O+','O-'];
  openModal(p?'تعديل بيانات المريض':'مريض جديد',
    '<form data-form="patient" data-id="'+(p?p.id:'')+'" novalidate><div class="fgrid">'
    +fld('f-name','الاسم الكامل','<input id="f-name" name="name" value="'+esc(v.name)+'" autocomplete="off" required>','span2')
    +fld('f-age','العمر بالسنوات','<input id="f-age" name="age" type="number" inputmode="numeric" min="0" max="120" value="'+esc(v.age===undefined?'':v.age)+'">')
    +fld('f-sex','النوع','<select id="f-sex" name="sex"><option'+(v.sex!=='أنثى'?' selected':'')+'>ذكر</option><option'+(v.sex==='أنثى'?' selected':'')+'>أنثى</option></select>')
    +fld('f-phone','رقم الهاتف','<input id="f-phone" name="phone" type="tel" inputmode="tel" dir="ltr" style="text-align:start" value="'+esc(v.phone)+'">')
    +fld('f-blood','فصيلة الدم','<select id="f-blood" name="blood">'+bl.map(b=>'<option value="'+b+'"'+(v.blood===b?' selected':'')+'>'+(b||'غير معروفة')+'</option>').join('')+'</select>')
    +fld('f-addr','المنطقة','<input id="f-addr" name="address" value="'+esc(v.address)+'">','span2')
    +fld('f-all','الحساسية','<input id="f-all" name="allergy" value="'+esc(v.allergy)+'">')
    +fld('f-chr','أمراض مزمنة','<input id="f-chr" name="chronic" value="'+esc(v.chronic)+'">')
    +fld('f-notes','ملاحظات','<textarea id="f-notes" name="notes">'+esc(v.notes)+'</textarea>','span2')
    +'</div>'+FOOT('حفظ')+'</form>');
}
function submitPatient(f){
  const d=Object.fromEntries(new FormData(f));
  const name=(d.name||'').trim(),age=Number(d.age);
  if(!name)return ferr(f,'اكتب اسم المريض.');
  if(d.age===''||!(age>=0&&age<=120))return ferr(f,'اكتب عمرًا صحيحًا بين 0 و120.');
  const rec={name:name,age:Math.round(age),sex:d.sex,phone:(d.phone||'').trim(),blood:d.blood||'',address:(d.address||'').trim(),allergy:(d.allergy||'').trim(),chronic:(d.chronic||'').trim(),notes:(d.notes||'').trim()};
  closeModal();
  if(f.dataset.id){Object.assign(pat(+f.dataset.id),rec);toast('تم حفظ التعديلات');render();}
  else{const p=addPatient(rec);toast('تمت إضافة المريض');go('patient-'+p.id);}
}

function openVisitForm(pid,apptId){
  const p=pat(pid);if(!p)return;
  const a=apptId?appt(apptId):null;
  const first=!db.visits.some(v=>v.pid===pid);
  const type=first?'كشف':'متابعة';
  openModal('زيارة جديدة',
    '<p class="note">'+esc(p.name)+' · ملف رقم <span class="num">'+p.id+'</span>'+(p.allergy?' · حساسية: '+esc(p.allergy):'')+'</p>'
    +'<form data-form="visit" data-pid="'+pid+'" data-appt="'+(a?a.id:'')+'" novalidate><div class="fgrid">'
    +fld('f-date','تاريخ الزيارة','<input id="f-date" name="date" type="date" max="'+TODAY+'" value="'+TODAY+'">')
    +fld('f-type','نوع الزيارة','<select id="f-type" name="type">'+Object.keys(FEES).map(t=>'<option value="'+t+'"'+(t===type?' selected':'')+'>'+t+'</option>').join('')+'</select>')
    +fld('f-comp','الشكوى','<textarea id="f-comp" name="complaint">'+esc(a?a.reason:'')+'</textarea>','span2')
    +fld('f-diag','التشخيص','<input id="f-diag" name="diagnosis" autocomplete="off">','span2')
    +fld('f-treat','العلاج والتوصيات','<textarea id="f-treat" name="treatment"></textarea>','span2')
    +fld('f-fee','قيمة الكشف (ج.م)','<input id="f-fee" name="fee" type="number" inputmode="numeric" min="0" value="'+FEES[type]+'">')
    +fld('f-paid','المدفوع الآن (ج.م)','<input id="f-paid" name="paid" type="number" inputmode="numeric" min="0" value="'+FEES[type]+'">')
    +'</div>'+FOOT('حفظ الزيارة')+'</form>');
}
function submitVisit(f){
  const d=Object.fromEntries(new FormData(f)),pid=+f.dataset.pid;
  const fee=Number(d.fee),paid=Number(d.paid);
  if(!(d.complaint||'').trim())return ferr(f,'اكتب شكوى المريض.');
  if(!(d.diagnosis||'').trim())return ferr(f,'اكتب التشخيص.');
  if(!d.date||d.date>TODAY)return ferr(f,'تاريخ الزيارة غير صحيح.');
  if(d.fee===''||!(fee>=0))return ferr(f,'اكتب قيمة الكشف.');
  if(d.paid===''||!(paid>=0)||paid>fee)return ferr(f,'المبلغ المدفوع لا يمكن أن يزيد على قيمة الكشف.');
  addVisit({pid:pid,date:d.date,type:d.type,complaint:d.complaint.trim(),diagnosis:d.diagnosis.trim(),treatment:(d.treatment||'').trim()||'—',fee:fee,paid:paid});
  if(f.dataset.appt){const a=appt(+f.dataset.appt);if(a)a.status='done';}
  closeModal();toast('تم حفظ الزيارة');render();
}

function slotOptions(date,sel){
  return SLOTS.map(t=>{
    const taken=slotTaken(date,t);
    return '<option value="'+t+'"'+(taken?' disabled':'')+(t===sel&&!taken?' selected':'')+'>'+timeText(t)+(taken?' (محجوز)':'')+'</option>';
  }).join('');
}
function openApptForm(o){
  o=o||{};
  const date=o.date||ui.day||TODAY;
  const list=db.patients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const hasVisits=o.pid&&db.visits.some(v=>v.pid===o.pid);
  openModal('حجز جديد',
    '<form data-form="appt" novalidate><div class="fgrid">'
    +fld('a-pid','المريض','<select id="a-pid" name="pid"><option value="">اختر المريض</option>'+list.map(p=>'<option value="'+p.id+'"'+(p.id===o.pid?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>','span2')
    +fld('a-date','اليوم','<input id="a-date" name="date" type="date" min="'+TODAY+'" max="'+addDays(TODAY,13)+'" value="'+date+'">')
    +fld('a-time','الساعة','<select id="a-time" name="time">'+slotOptions(date,o.time)+'</select>')
    +fld('a-reason','سبب الزيارة','<input id="a-reason" name="reason" autocomplete="off" value="'+(hasVisits?'متابعة':'كشف')+'">','span2')
    +'</div><p class="note" style="margin-top:10px">الحجز متاح خلال 14 يومًا من اليوم.</p>'+FOOT('تأكيد الحجز')+'</form>');
}
function submitAppt(f){
  const d=Object.fromEntries(new FormData(f));
  if(!d.pid)return ferr(f,'اختر المريض أولًا.');
  if(!d.date||d.date<TODAY||d.date>addDays(TODAY,13))return ferr(f,'اختر يومًا خلال 14 يومًا من اليوم.');
  if(!d.time)return ferr(f,'لا توجد مواعيد متاحة في هذا اليوم. اختر يومًا آخر.');
  if(slotTaken(d.date,d.time))return ferr(f,'هذا الموعد محجوز بالفعل. اختر ساعة أخرى.');
  const a=addAppt(+d.pid,d.date,d.time,(d.reason||'').trim()||'كشف','booked');
  ui.day=d.date;closeModal();toast('تم حجز '+pat(a.pid).name+' الساعة '+timeText(a.time));render();
}
function setAppt(id,st,msg){const a=appt(id);if(!a)return;a.status=st;toast(msg+': '+pat(a.pid).name);render();}
function restoreAppt(id){
  const a=appt(id);if(!a)return;
  if(slotTaken(a.date,a.time,a.id)){toast('هذا الموعد أصبح محجوزًا لمريض آخر');return;}
  setAppt(id,'booked','تمت إعادة الحجز');
}

function unpaidFor(pid,vid){
  const t=vid?db.visits.filter(v=>v.id===vid):db.visits.filter(v=>v.pid===pid&&v.fee>v.paid);
  return t.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
}
function openCollect(pid,vid){
  const p=pat(pid);if(!p)return;
  const bal=sum(unpaidFor(pid,vid).map(v=>({d:v.fee-v.paid})),'d');
  if(bal<=0){toast('لا توجد مستحقات على هذا المريض');return;}
  openModal('تحصيل مبلغ',
    '<p class="note">'+esc(p.name)+' · المتبقي '+money(bal)+'</p>'
    +'<form data-form="collect" data-pid="'+pid+'" data-vid="'+(vid||'')+'" novalidate><div class="fgrid">'
    +fld('c-amt','المبلغ المحصّل (ج.م)','<input id="c-amt" name="amount" type="number" inputmode="numeric" min="1" max="'+bal+'" value="'+bal+'">','span2')
    +'</div>'+FOOT('تسجيل الدفعة')+'</form>');
}
function submitCollect(f){
  const pid=+f.dataset.pid,vid=+f.dataset.vid||0;
  const targets=unpaidFor(pid,vid);
  const bal=sum(targets.map(v=>({d:v.fee-v.paid})),'d');
  const amt=Number(new FormData(f).get('amount'));
  if(!(amt>0))return ferr(f,'اكتب مبلغًا أكبر من صفر.');
  if(amt>bal)return ferr(f,'المبلغ أكبر من المتبقي ('+num(bal)+' ج.م).');
  let rest=amt;
  targets.forEach(v=>{const x=Math.min(rest,v.fee-v.paid);if(x>0){addPayment(v,x,TODAY);rest-=x;}});
  closeModal();toast('تم تسجيل دفعة '+num(amt)+' ج.م');render();
}

function openExpenseForm(){
  openModal('تسجيل مصروف',
    '<form data-form="expense" novalidate><div class="fgrid">'
    +fld('x-label','البند','<input id="x-label" name="label" autocomplete="off">','span2')
    +fld('x-amt','المبلغ (ج.م)','<input id="x-amt" name="amount" type="number" inputmode="numeric" min="1">')
    +fld('x-date','التاريخ','<input id="x-date" name="date" type="date" max="'+TODAY+'" value="'+TODAY+'">')
    +'</div>'+FOOT('حفظ المصروف')+'</form>');
}
function submitExpense(f){
  const d=Object.fromEntries(new FormData(f)),amt=Number(d.amount);
  if(!(d.label||'').trim())return ferr(f,'اكتب بند المصروف.');
  if(d.amount===''||!(amt>0))return ferr(f,'اكتب مبلغًا أكبر من صفر.');
  if(!d.date||d.date>TODAY)return ferr(f,'تاريخ المصروف غير صحيح.');
  addExpense(d.date,d.label.trim(),amt);
  closeModal();toast('تم تسجيل المصروف');render();
}

/* ---------- events ---------- */
const FORMS={patient:submitPatient,visit:submitVisit,appt:submitAppt,collect:submitCollect,expense:submitExpense};
document.addEventListener('click',e=>{
  if(e.target===modal){closeModal();return;}
  const t=e.target.closest('[data-action]');if(!t)return;
  const a=t.dataset.action,id=+t.dataset.id||0;
  switch(a){
    case 'go':go(t.dataset.to);break;
    case 'close':closeModal();break;
    case 'open-patient':go('patient-'+id);break;
    case 'new-patient':openPatientForm();break;
    case 'edit-patient':openPatientForm(pat(id));break;
    case 'new-visit':openVisitForm(id);break;
    case 'appt-visit':{const ap=appt(id);if(ap)openVisitForm(ap.pid,ap.id);break;}
    case 'new-appt':openApptForm({pid:+t.dataset.pid||0,date:t.dataset.date,time:t.dataset.time});break;
    case 'appt-arrive':setAppt(id,'waiting','تم تسجيل الوصول');break;
    case 'appt-cancel':setAppt(id,'cancelled','تم إلغاء الحجز');break;
    case 'appt-restore':restoreAppt(id);break;
    case 'pick-day':ui.day=t.dataset.date;render();break;
    case 'collect':openCollect(+t.dataset.pid,+t.dataset.vid||0);break;
    case 'new-expense':openExpenseForm();break;
    case 'pfilter':ui.pf=t.dataset.f;ui.pLimit=30;render();break;
    case 'more-patients':ui.pLimit+=30;fillPatients();break;
    case 'invfilter':ui.inv=t.dataset.f;ui.invLimit=15;render();break;
    case 'more-inv':ui.invLimit+=15;render();break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-type'){const fee=FEES[e.target.value]||0;$('#f-fee').value=fee;$('#f-paid').value=fee;}
  if(e.target.id==='a-date'){$('#a-time').innerHTML=slotOptions(e.target.value);}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;ui.pLimit=30;fillPatients();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal();});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(validRoute(r)&&r!==ui.route){ui.route=r;render();}});

const h0=(location.hash||'').slice(1);
ui.route=validRoute(h0)?h0:'today';
render();
})();
</script>

</body></html>
