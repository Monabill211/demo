<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديمو مصنع المعادن</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--tx:#f2f2f2;--mut:#9a9a9a;--ac:#e11d2e;--acx:#fff;--bd:#2c2c2c;--ok:#ffffff;--bad:#ff4d5a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
header{padding:14px 16px 6px;font-weight:700;font-size:18px}
header small{display:block;color:var(--mut);font-weight:400;font-size:12px}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{flex:1;white-space:nowrap;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:8px 12px 28px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select{flex:1;min-width:110px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:inherit;cursor:pointer}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:#fff;color:#000}.btn.r{background:var(--ac);color:#fff}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
.low{color:var(--bad);font-weight:700}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kp b{display:block;font-size:20px;margin-top:4px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
</style>
</head>
<body>
<header>🏭 مصنع المعادن — ديمو<small>بيانات تجريبية، أي تغيير بيتحسب في الحسابات فورًا</small></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var $=function(s){return document.querySelector(s)};
var CATS=["عدة","قطع غيار","خامات"];
var S={
 tab:"inv",
 items:[
  {id:1,name:"صاج حديد 3مم",cat:"خامات",qty:120,unit:"لوح",cost:850},
  {id:2,name:"ماسورة ستانلس",cat:"خامات",qty:60,unit:"متر",cost:210},
  {id:3,name:"اسطمبة قص",cat:"عدة",qty:6,unit:"قطعة",cost:1200},
  {id:4,name:"رفايع لحام",cat:"قطع غيار",qty:200,unit:"قطعة",cost:15},
  {id:5,name:"سيور ماكينة",cat:"قطع غيار",qty:8,unit:"قطعة",cost:340}
 ],
 orders:[],
 jobs:[
  {id:1,client:"شركة الأمل",name:"أبواب حديد 10 قطع",det:"صاج 3مم + دهان فرن",cost:14000,price:19500,st:"تم التسليم"}
 ],
 emps:[
  {id:1,name:"أحمد محمود",role:"لحام",wage:350,h:8,inT:"",log:[]},
  {id:2,name:"محمد السيد",role:"خراط",wage:400,h:8,inT:"",log:[]},
  {id:3,name:"عمر حسن",role:"عامل",wage:250,h:8,inT:"",log:[]}
 ]
};
var nid=100;
var fm=function(n){return Number(n).toLocaleString("ar-EG",{maximumFractionDigits:0})+" ج"};
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var now=function(){return new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})};
var TABS=[["inv","📦 المخزون"],["job","🔧 التوريد"],["att","👷 الموظفين"],["acc","📊 الحسابات"]];

function pay(e){return e.log.reduce(function(a,l){return a+l.h*e.wage/8},0)}
function totals(){
 var sales=0,jc=0;S.jobs.forEach(function(j){sales+=j.price;jc+=j.cost});
 var ded=S.orders.reduce(function(a,o){return a+o.val},0);
 var stock=S.items.reduce(function(a,i){return a+i.qty*i.cost},0);
 var sal=S.emps.reduce(function(a,e){return a+pay(e)},0);
 return {sales:sales,jc:jc,ded:ded,stock:stock,sal:sal,net:sales-jc-ded-sal};
}

function inv(){
 var opts=S.items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+' (متاح '+i.qty+')</option>'}).join("");
 var rows=S.items.map(function(i){return '<tr><td>'+esc(i.name)+'</td><td><span class="tag">'+i.cat+'</span></td><td class="'+(i.qty<10?'low':'')+'">'+i.qty+' '+i.unit+'</td><td>'+fm(i.cost)+'</td><td>'+fm(i.qty*i.cost)+'</td></tr>'}).join("");
 var ord=S.orders.length?S.orders.slice().reverse().map(function(o){return '<tr><td>#'+o.n+'</td><td>'+esc(o.item)+'</td><td>'+o.q+'</td><td>'+esc(o.why)+'</td><td>'+fm(o.val)+'</td></tr>'}).join(""):'';
 return '<div class="card"><h3>➕ إضافة صنف</h3><div class="row"><input id="an" placeholder="اسم الصنف"><select id="ac">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select><input id="aq" type="number" placeholder="الكمية"><input id="au" placeholder="الوحدة"><input id="ap" type="number" placeholder="سعر الوحدة"><button class="btn" onclick="addItem()">إضافة</button></div></div>'
 +'<div class="card"><h3>المخزون</h3><div class="sc"><table><tr><th>الصنف</th><th>النوع</th><th>الكمية</th><th>سعر الوحدة</th><th>القيمة</th></tr>'+rows+'</table></div></div>'
 +'<div class="card"><h3>📝 أمر خصم من المخزون</h3><div class="row"><select id="di">'+opts+'</select><input id="dq" type="number" min="1" placeholder="الكمية"><input id="dw" placeholder="السبب (مثلاً: شغلانة أبواب)"><button class="btn r" onclick="deduct()">خصم</button></div></div>'
 +'<div class="card"><h3>سجل أوامر الخصم</h3>'+(ord?'<div class="sc"><table><tr><th>رقم</th><th>الصنف</th><th>الكمية</th><th>السبب</th><th>القيمة</th></tr>'+ord+'</table></div>':'<div class="empty">مفيش أوامر خصم لسه</div>')+'</div>';
}
function addItem(){
 var n=$("#an").value.trim(),q=+$("#aq").value,p=+$("#ap").value;
 if(!n||!(q>0))return;
 S.items.push({id:++nid,name:n,cat:$("#ac").value,qty:q,unit:$("#au").value||"وحدة",cost:p||0});draw();
}
function deduct(){
 var it=S.items.filter(function(i){return i.id==$("#di").value})[0],q=+$("#dq").value;
 if(!it||!(q>0))return;
 if(q>it.qty){alert("الكمية أكبر من المتاح ("+it.qty+")");return}
 it.qty-=q;
 S.orders.push({n:S.orders.length+1,item:it.name,q:q,why:$("#dw").value||"-",val:q*it.cost});draw();
}

function job(){
 var rows=S.jobs.map(function(j){var pr=j.price-j.cost;return '<tr><td>'+esc(j.client)+'</td><td>'+esc(j.name)+'<br><small style="color:var(--mut)">'+esc(j.det)+'</small></td><td>'+fm(j.cost)+'</td><td>'+fm(j.price)+'</td><td class="'+(pr>=0?'pos':'neg')+'">'+fm(pr)+'</td><td><span class="tag">'+j.st+'</span></td></tr>'}).join("");
 return '<div class="card"><h3>➕ شغلانة جديدة</h3><div class="row"><input id="jc" placeholder="العميل"><input id="jn" placeholder="اسم الشغلانة"></div><div class="row"><input id="jd" placeholder="التفاصيل"></div><div class="row"><input id="jk" type="number" placeholder="التكلفة عليا"><input id="jp" type="number" placeholder="سعر البيع"><button class="btn" onclick="addJob()">حفظ</button></div></div>'
 +'<div class="card"><h3>الشغلانات</h3><div class="sc"><table><tr><th>العميل</th><th>الشغلانة</th><th>التكلفة</th><th>البيع</th><th>الربح</th><th>الحالة</th></tr>'+rows+'</table></div></div>';
}
function addJob(){
 var n=$("#jn").value.trim(),k=+$("#jk").value,p=+$("#jp").value;
 if(!n||!(p>0))return;
 S.jobs.push({id:++nid,client:$("#jc").value||"-",name:n,det:$("#jd").value||"-",cost:k||0,price:p,st:"قيد التنفيذ"});draw();
}

function att(){
 var rows=S.emps.map(function(e){
  var st=e.inT?'<span class="pos">حاضر من '+e.inT+'</span>':'—';
  return '<tr><td>'+esc(e.name)+'<br><small style="color:var(--mut)">'+e.role+' • '+fm(e.wage)+'/يوم</small></td><td>'+st+'</td><td><input type="number" value="'+e.h+'" style="min-width:60px;width:64px" onchange="S.emps['+(e.id-1)+'].h=+this.value"></td><td><button class="btn s g" onclick="inn('+(e.id-1)+')">حضور</button> <button class="btn s r" onclick="out('+(e.id-1)+')">انصراف</button></td><td>'+e.log.length+'</td><td>'+fm(pay(e))+'</td></tr>';
 }).join("");
 var total=S.emps.reduce(function(a,e){return a+pay(e)},0);
 var logs=[];S.emps.forEach(function(e){e.log.forEach(function(l){logs.push('<tr><td>'+esc(e.name)+'</td><td>'+l.i+'</td><td>'+l.o+'</td><td>'+l.h+'</td><td>'+fm(l.h*e.wage/8)+'</td></tr>')})});
 return '<div class="card"><h3>الحضور والانصراف</h3><div class="sc"><table><tr><th>الموظف</th><th>الحالة</th><th>ساعات (ديمو)</th><th></th><th>أيام</th><th>المستحق</th></tr>'+rows+'</table></div><div class="row" style="margin-top:10px"><b>إجمالي الرواتب المستحقة: '+fm(total)+'</b></div></div>'
 +'<div class="card"><h3>سجل الحضور</h3>'+(logs.length?'<div class="sc"><table><tr><th>الموظف</th><th>حضور</th><th>انصراف</th><th>ساعات</th><th>القبض</th></tr>'+logs.join("")+'</table></div>':'<div class="empty">اضغط حضور ثم انصراف علشان يتسجل يوم</div>')+'</div>';
}
function inn(i){S.emps[i].inT=now();draw()}
function out(i){var e=S.emps[i];if(!e.inT)return;e.log.push({i:e.inT,o:now(),h:e.h});e.inT="";draw()}

function acc(){
 var t=totals();
 return '<div class="kp"><div>إجمالي المبيعات<b class="pos">'+fm(t.sales)+'</b></div><div>تكلفة الشغلانات<b>'+fm(t.jc)+'</b></div><div>مصروفات (أوامر خصم)<b>'+fm(t.ded)+'</b></div><div>رواتب الموظفين<b>'+fm(t.sal)+'</b></div><div>قيمة المخزون الحالي<b>'+fm(t.stock)+'</b></div><div>صافي الربح<b class="'+(t.net>=0?'pos':'neg')+'">'+fm(t.net)+'</b></div></div>'
 +'<div class="card" style="margin-top:12px"><h3>ازاي بتتحسب؟</h3><div class="empty">صافي الربح = المبيعات − تكلفة الشغلانات − قيمة أوامر الخصم − الرواتب المستحقة</div></div>';
}

function draw(){
 $("#nav").innerHTML=TABS.map(function(t){return '<button class="'+(S.tab==t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';draw()">'+t[1]+'</button>'}).join("");
 $("#app").innerHTML=({inv:inv,job:job,att:att,acc:acc})[S.tab]();
}
draw();
</script>
</body>
</html>
